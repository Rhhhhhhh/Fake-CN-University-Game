<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="野鸡大学辨别小游戏：从 30 所学校中找出 15 所正规大学">
<meta name="referrer" content="no-referrer">
<title>野鸡大学辨别——找出正规大学！</title>
<style>
:root {
  --bg: #f4f6fa;
  --card: #ffffff;
  --line: #e3e8f0;
  --text: #1f2937;
  --muted: #6b7280;
  --primary: #2563eb;
  --primary-dark: #1d4ed8;
  --ok: #16a34a;
  --ok-bg: #e8f7ee;
  --bad: #dc2626;
  --bad-bg: #fdeceb;
  --miss: #b45309;
  --miss-bg: #fdf3e3;
  --radius: 14px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", system-ui, -apple-system, "Segoe UI", sans-serif;
  line-height: 1.6;
  -webkit-text-size-adjust: 100%;
}

.app {
  max-width: 1000px;
  margin: 0 auto;
  padding: 28px 18px 56px;
}

.hidden { display: none !important; }

/* ---------- 头部 ---------- */
.hero { text-align: center; margin-bottom: 24px; }
.hero-compact { margin-bottom: 18px; }
.hero-title {
  margin: 0 0 8px;
  font-size: clamp(22px, 4.4vw, 34px);
  font-weight: 800;
  letter-spacing: .5px;
  color: var(--text);
}
.hero-accent { color: var(--primary); }
.hero-sub { margin: 0; color: var(--muted); font-size: clamp(13px, 2.6vw, 15px); }

/* ---------- 难度选择 ---------- */
.levels {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 14px;
  margin-bottom: 22px;
}
.level-card {
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: flex-start;
  text-align: left;
  padding: 18px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: 0 2px 10px rgba(15, 23, 42, .05);
  cursor: pointer;
  font: inherit;
  color: inherit;
  transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease;
}
.level-card:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(15, 23, 42, .10); border-color: #c7d7f5; }
.level-card:focus-visible { outline: 3px solid #93c5fd; outline-offset: 2px; }
.level-tag {
  font-size: 15px;
  font-weight: 800;
  padding: 3px 12px;
  border-radius: 999px;
  color: #fff;
}
.level-easy { background: var(--ok); }
.level-medium { background: var(--primary); }
.level-hard { background: var(--bad); }
.level-hell { background: #111827; }
.level-desc { font-size: 13px; color: var(--muted); }

.rules { text-align: center; font-size: 13px; color: var(--muted); margin: 0 0 6px; }
.source { text-align: center; font-size: 12px; color: #9aa3b2; margin: 0; }

/* ---------- HUD ---------- */
/* 固定在顶部：卡片较多需要滚动时，倒计时与计数始终可见 */
.hud {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  padding: 10px 0 12px;
  margin-bottom: 8px;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.hud-item {
  min-width: 84px;
  padding: 6px 14px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}
.hud-label { font-size: 12px; color: var(--muted); }
.hud-value { font-size: 19px; font-weight: 800; font-variant-numeric: tabular-nums; }
.hud-ok { color: var(--ok); }
.hud-bad { color: var(--bad); }
.hud-value.urgent { color: var(--bad); }

/* ---------- 网格 ---------- */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
  gap: 10px;
}
.tile {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  min-height: 62px;
  padding: 10px 8px;
  background: var(--card);
  border: 1.5px solid var(--line);
  border-radius: 12px;
  font: inherit;
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  cursor: pointer;
  text-align: center;
  transition: background .12s ease, border-color .12s ease, transform .1s ease;
}
.tile:hover:not(.locked) { border-color: var(--primary); transform: translateY(-1px); }
.tile:focus-visible { outline: 3px solid #93c5fd; outline-offset: 2px; }
.tile.locked { cursor: default; }
.tile-name { word-break: break-all; }
.tile-note { font-size: 11px; font-weight: 500; color: var(--muted); }

.tile.correct { background: var(--ok-bg); border-color: var(--ok); color: #14532d; }
.tile.correct .tile-note { color: #15803d; }
.tile.wrong { background: var(--bad-bg); border-color: var(--bad); color: #7f1d1d; }
.tile.wrong .tile-note { color: #b91c1c; }
.tile.missed { background: var(--miss-bg); border-color: var(--miss); color: #78350f; }
.tile.missed .tile-note { color: #a16207; }
.tile.reveal-fake { background: var(--bad-bg); border-color: #f0a5a2; color: #7f1d1d; }
.tile.reveal-fake .tile-note { color: #b91c1c; }
.tile.dim { opacity: .55; }

/* ---------- 结果 ---------- */
.result {
  margin-top: 20px;
  padding: 16px 18px;
  border-radius: var(--radius);
  background: var(--card);
  border: 1px solid var(--line);
  text-align: center;
}
.result-title { margin: 0 0 4px; font-size: 18px; font-weight: 800; }
.result-title.win { color: var(--ok); }
.result-title.lose { color: var(--bad); }
.result-detail { margin: 0; font-size: 13px; color: var(--muted); }

.legend {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 16px;
  margin-top: 14px;
  font-size: 12px;
  color: var(--muted);
}
.legend-item { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.dot-ok { background: var(--ok-bg); border: 1.5px solid var(--ok); }
.dot-bad { background: var(--bad-bg); border: 1.5px solid var(--bad); }
.dot-miss { background: var(--miss-bg); border: 1.5px solid var(--miss); }

/* ---------- 按钮 ---------- */
.actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 12px;
  margin-top: 22px;
}
.btn {
  padding: 11px 26px;
  border-radius: 10px;
  font: inherit;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  border: 1.5px solid transparent;
  transition: background .12s ease, border-color .12s ease;
}
.btn:focus-visible { outline: 3px solid #93c5fd; outline-offset: 2px; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-ghost { background: var(--card); color: var(--primary); border-color: #c7d7f5; }
.btn-ghost:hover { background: #eef4ff; }

@media (max-width: 560px) {
  .app { padding: 16px 10px 40px; }
  /* 手机上每行固定 3 个学校卡片 */
  .grid {
    grid-template-columns: repeat(3, 1fr);
    gap: 7px;
  }
  .tile {
    min-height: 64px;
    padding: 8px 5px;
    font-size: 12px;
    line-height: 1.35;
  }
  .tile-note { font-size: 10px; }
  .hud { gap: 6px; padding: 8px 0 10px; }
  .hud-item { min-width: 68px; padding: 5px 8px; }
  .hud-value { font-size: 17px; }
  .hero-compact { margin-bottom: 12px; }
}

</style>
</head>
<body>
<main id="app" class="app">

  <!-- 首页：难度选择 -->
  <section id="screen-home" class="screen">
    <header class="hero">
      <h1 class="hero-title">野鸡大学辨别<span class="hero-accent">——找出正规大学！</span></h1>
      <p class="hero-sub">从 30 所学校中挑出 15 所正规大学，别被“野鸡大学”骗了</p>
    </header>

    <div class="levels">
      <button type="button" class="level-card" data-level="easy">
        <span class="level-tag level-easy">简单</span>
        <span class="level-desc">知名公办大学 VS 名字浮夸的野鸡大学（如“中国XX大学”）</span>
      </button>
      <button type="button" class="level-card" data-level="medium">
        <span class="level-tag level-medium">中等</span>
        <span class="level-desc">正规“学院”与各类公办大学 VS 名字正常、只差“学院/大学”后缀的野鸡大学</span>
      </button>
      <button type="button" class="level-card" data-level="hard">
        <span class="level-tag level-hard">困难</span>
        <span class="level-desc">公办与民办院校混合 VS 高度仿冒、极易混淆的野鸡大学</span>
      </button>
      <button type="button" class="level-card" data-level="hell">
        <span class="level-tag level-hell">地狱</span>
        <span class="level-desc">以地方院校为主，仅夹带 2~4 所大学 VS 高度仿冒、极易混淆的野鸡大学</span>
      </button>
    </div>

    <p class="rules">每局 30 所学校（15 正规 + 15 野鸡） · 限时 5 分钟 · 允许错 5 次</p>
    <p class="source">正规高校来自教育部《全国普通高等学校名单》，野鸡大学来自人民日报曝光的 392 所虚假大学名单</p>
  </section>

  <!-- 游戏页 -->
  <section id="screen-game" class="screen hidden">
    <header class="hero hero-compact">
      <h1 class="hero-title">野鸡大学辨别<span class="hero-accent">——找出正规大学！</span></h1>
      <p class="hero-sub" id="levelHint">点击你认为的正规大学</p>
    </header>

    <div class="hud" role="status" aria-live="polite">
      <div class="hud-item"><span class="hud-label">倒计时</span><span class="hud-value" id="hudTime">5:00</span></div>
      <div class="hud-item"><span class="hud-label">已找到</span><span class="hud-value hud-ok" id="hudFound">0</span></div>
      <div class="hud-item"><span class="hud-label">剩余</span><span class="hud-value" id="hudLeft">15</span></div>
      <div class="hud-item"><span class="hud-label">可错</span><span class="hud-value hud-bad" id="hudLives">5</span></div>
    </div>

    <div id="grid" class="grid" role="list" aria-label="学校列表"></div>

    <div id="result" class="result hidden" role="status" aria-live="polite">
      <p class="result-title" id="resultTitle"></p>
      <p class="result-detail" id="resultDetail"></p>
    </div>

    <div class="legend hidden" id="legend">
      <span class="legend-item"><i class="dot dot-ok"></i>正规大学</span>
      <span class="legend-item"><i class="dot dot-bad"></i>野鸡大学</span>
      <span class="legend-item"><i class="dot dot-miss"></i>漏选的正规大学</span>
    </div>

    <div class="actions">
      <button type="button" class="btn btn-primary" id="btnRestart">再玩一局</button>
      <button type="button" class="btn btn-ghost" id="btnBack">换个难度</button>
    </div>
  </section>

</main>

<script>
/* 野鸡大学辨别 —— 游戏逻辑
 * 安全约定：
 *   1. 全程使用 createElement + textContent 渲染，禁止 innerHTML / eval / document.write
 *   2. 载入的静态数据在渲染前做白名单字段与类型、长度校验
 *   3. 不写入 localStorage / Cookie，不发起任何网络请求，不加载第三方资源
 */
(function () {
  'use strict';

  var REAL_COUNT = 15;      // 每局正规大学数量
  var FAKE_COUNT = 15;      // 每局野鸡大学数量
  var MAX_MISTAKES = 5;     // 允许错误次数
  var TIME_LIMIT = 300;     // 限时（秒）
  var MAX_NAME_LEN = 40;

  var LEVEL_HINT = {
    easy: '简单：知名公办大学 VS 名字浮夸的野鸡大学',
    medium: '中等：正规“学院”与各类公办大学 VS 名字正常、只差后缀的野鸡大学',
    hard: '困难：公办与民办院校混合 VS 高度仿冒的野鸡大学',
    hell: '地狱：以地方院校为主，仅 2~4 所大学 VS 高度仿冒的野鸡大学'
  };

  var el = {};
  var state = null;
  var timerId = null;

  /* ---------------- 数据校验（防数据被篡改后注入） ---------------- */

  function cleanText(value, maxLen) {
    if (typeof value !== 'string') return '';
    // 去除控制字符，限制长度，避免异常数据撑爆布局
    return value.replace(/[\u0000-\u001f\u007f-\u009f]/g, '').trim().slice(0, maxLen);
  }

  function pickString(source, key, maxLen) {
    return Object.prototype.hasOwnProperty.call(source, key)
      ? cleanText(source[key], maxLen)
      : '';
  }

  function toReal(item) {
    if (!item || typeof item !== 'object') return null;
    var name = pickString(item, 'n', MAX_NAME_LEN);
    if (name.length < 3) return null;
    var pub = pickString(item, 'pub', 4);
    return {
      name: name,
      loc: pickString(item, 'loc', 12),
      pub: (pub === '公办' || pub === '民办') ? pub : '公办',
      lvl: pickString(item, 'lvl', 4) || '本科',
      twin: pickString(item, 'twin', MAX_NAME_LEN),
      tsim: typeof item.tsim === 'number' && isFinite(item.tsim) ? item.tsim : 0
    };
  }

  function normalizePool(rawPool) {
    var result = { real: [], fake: [], realUniv: [] };
    if (!rawPool || typeof rawPool !== 'object') return result;

    var rawReal = Array.isArray(rawPool.real) ? rawPool.real : [];
    var rawFake = Array.isArray(rawPool.fake) ? rawPool.fake : [];
    var rawUniv = Array.isArray(rawPool.realUniv) ? rawPool.realUniv : [];

    rawReal.concat(rawUniv).forEach(function (item, idx) {
      var rec = toReal(item);
      if (!rec) return;
      if (idx < rawReal.length) result.real.push(rec);
      else result.realUniv.push(rec);
    });

    rawFake.forEach(function (item) {
      if (!item || typeof item !== 'object') return;
      var name = pickString(item, 'n', MAX_NAME_LEN);
      if (name.length < 3) return;
      result.fake.push({
        name: name,
        prov: pickString(item, 'prov', 12)
      });
    });

    return result;
  }

  function loadPools() {
    var data = window.GAME_DATA;
    if (!data || !data.pools || typeof data.pools !== 'object') return null;
    var pools = {};
    ['easy', 'medium', 'hard', 'hell'].forEach(function (level) {
      pools[level] = normalizePool(data.pools[level]);
    });
    if (!pools.easy.real.length || !pools.easy.fake.length) return null;
    return pools;
  }

  /* ---------------- 工具 ---------------- */

  function shuffle(list) {
    var arr = list.slice();
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = arr[i];
      arr[i] = arr[j];
      arr[j] = tmp;
    }
    return arr;
  }

  function sample(list, count) {
    return shuffle(list).slice(0, Math.min(count, list.length));
  }

  function formatTime(seconds) {
    var s = Math.max(0, seconds);
    var m = Math.floor(s / 60);
    var r = s % 60;
    return m + ':' + (r < 10 ? '0' + r : String(r));
  }

  /* ---------------- 组局 ---------------- */

  function buildRound(level) {
    var pool = state.pools[level] || state.pools.easy;
    var reals = pool.real;
    var fakes = pool.fake;

    var pickedFake = sample(fakes, FAKE_COUNT);
    var fakeNames = pickedFake.map(function (f) { return f.name; });

    // 避免同一局出现与某所野鸡大学几乎同名的正规大学（防止出现"两个答案"的死局）
    var usable = pool.realUniv.length ? pool.real.concat(pool.realUniv) : reals;
    var candidates = usable.filter(function (r) {
      return !(r.twin && r.tsim >= 0.88 && fakeNames.indexOf(r.twin) !== -1);
    });
    if (candidates.length < REAL_COUNT) candidates = usable;

    var pickedReal;
    if (pool.realUniv.length) {
      // 地狱档：先定 2~4 所普通大学，其余名额全部给普通学院
      var univWant = 2 + Math.floor(Math.random() * 3);
      var univPool = candidates.filter(function (r) {
        return pool.realUniv.indexOf(r) !== -1;
      });
      var collegePool = candidates.filter(function (r) {
        return pool.realUniv.indexOf(r) === -1;
      });
      var pickedUniv = sample(univPool, Math.min(univWant, univPool.length));
      pickedReal = pickedUniv.concat(sample(collegePool, REAL_COUNT - pickedUniv.length));
    } else {
      pickedReal = sample(candidates, REAL_COUNT);
    }

    var cards = pickedReal.map(function (r) {
      return { name: r.name, kind: 'real', note: [r.loc, r.pub, r.lvl].filter(Boolean).join(' · ') };
    }).concat(pickedFake.map(function (f) {
      return { name: f.name, kind: 'fake', note: '虚假大学 · ' + f.prov };
    }));

    return shuffle(cards);
  }

  /* ---------------- 渲染 ---------------- */

  function makeText(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined && text !== null) node.textContent = String(text);
    return node;
  }

  function renderGrid(cards) {
    var grid = el.grid;
    grid.textContent = '';
    cards.forEach(function (card, index) {
      var tile = document.createElement('button');
      tile.type = 'button';
      tile.className = 'tile';
      tile.setAttribute('role', 'listitem');
      tile.dataset.index = String(index);
      tile.appendChild(makeText('span', 'tile-name', card.name));
      tile.appendChild(makeText('span', 'tile-note', ''));
      grid.appendChild(tile);
      card.node = tile;
    });
  }

  function updateHud() {
    el.hudFound.textContent = String(state.found);
    el.hudLeft.textContent = String(REAL_COUNT - state.found);
    el.hudLives.textContent = String(MAX_MISTAKES - state.mistakes);
    var timeText = formatTime(state.remain);
    el.hudTime.textContent = timeText;
    if (state.remain <= 30) {
      el.hudTime.classList.add('urgent');
    } else {
      el.hudTime.classList.remove('urgent');
    }
  }

  function lockTile(card, className) {
    card.node.classList.add('locked', className);
    card.node.disabled = true;
    card.node.setAttribute('aria-disabled', 'true');
    var note = card.node.querySelector('.tile-note');
    if (note) note.textContent = card.note;
  }

  /* ---------------- 流程 ---------------- */

  function startTimer() {
    stopTimer();
    timerId = window.setInterval(function () {
      if (state.over) { stopTimer(); return; }
      state.remain -= 1;
      updateHud();
      if (state.remain <= 0) {
        state.remain = 0;
        finish('timeout');
      }
    }, 1000);
  }

  function stopTimer() {
    if (timerId !== null) {
      window.clearInterval(timerId);
      timerId = null;
    }
  }

  function finish(reason) {
    if (state.over) return;
    state.over = true;
    stopTimer();

    state.cards.forEach(function (card) {
      card.node.disabled = true;
      card.node.classList.add('locked');
      card.node.classList.remove('dim');
      var note = card.node.querySelector('.tile-note');
      if (note) note.textContent = card.note;
      if (card.kind === 'real') {
        if (card.state === 'found') return;      // 已选中的正规大学保持绿色
        card.node.classList.add('missed');
      } else {
        if (card.state === 'wrong') return;      // 已选错的野鸡大学保持红色
        card.node.classList.add('reveal-fake');
        card.node.classList.add('dim');
      }
    });

    el.legend.classList.remove('hidden');
    showResult(reason);
  }

  function showResult(reason) {
    var title = el.resultTitle;
    var detail = el.resultDetail;
    el.result.classList.remove('hidden');
    title.classList.remove('win', 'lose');

    var used = TIME_LIMIT - state.remain;
    if (reason === 'win') {
      title.textContent = '恭喜通关！15 所正规大学全部找到';
      title.classList.add('win');
      detail.textContent = '用时 ' + formatTime(used) + '，失误 ' + state.mistakes + ' 次（最多允许 ' + MAX_MISTAKES + ' 次）。对照下方颜色核对答案。';
    } else if (reason === 'timeout') {
      title.textContent = '时间到！';
      title.classList.add('lose');
      detail.textContent = '已找到 ' + state.found + '/15 所正规大学，失误 ' + state.mistakes + ' 次。下方标出全部正确答案。';
    } else {
      title.textContent = '错误次数已用完！';
      title.classList.add('lose');
      detail.textContent = '已找到 ' + state.found + '/15 所正规大学。下方标出全部正确答案，看看漏了哪些。';
    }
  }

  function onTileClick(event) {
    var tile = event.target.closest ? event.target.closest('.tile') : null;
    if (!tile || state.over) return;
    var index = Number(tile.dataset.index);
    if (!isFinite(index)) return;
    var card = state.cards[index];
    if (!card || card.state) return;

    if (card.kind === 'real') {
      card.state = 'found';
      state.found += 1;
      lockTile(card, 'correct');
      updateHud();
      if (state.found >= REAL_COUNT) finish('win');
    } else {
      card.state = 'wrong';
      state.mistakes += 1;
      lockTile(card, 'wrong');
      updateHud();
      if (state.mistakes >= MAX_MISTAKES) finish('mistakes');
    }
  }

  function startGame(level) {
    stopTimer();
    var pool = state.pools[level] ? level : 'easy';
    state.level = pool;
    state.cards = buildRound(pool);
    state.found = 0;
    state.mistakes = 0;
    state.remain = TIME_LIMIT;
    state.over = false;

    el.levelHint.textContent = LEVEL_HINT[pool] || LEVEL_HINT.easy;
    el.result.classList.add('hidden');
    el.legend.classList.add('hidden');
    el.resultTitle.textContent = '';
    el.resultDetail.textContent = '';

    renderGrid(state.cards);
    updateHud();
    show('game');
    startTimer();
  }

  function show(screen) {
    var isGame = screen === 'game';
    el.home.classList.toggle('hidden', isGame);
    el.game.classList.toggle('hidden', !isGame);
    window.scrollTo(0, 0);
  }

  /* ---------------- 初始化 ---------------- */

  function init() {
    el.home = document.getElementById('screen-home');
    el.game = document.getElementById('screen-game');
    el.grid = document.getElementById('grid');
    el.hudTime = document.getElementById('hudTime');
    el.hudFound = document.getElementById('hudFound');
    el.hudLeft = document.getElementById('hudLeft');
    el.hudLives = document.getElementById('hudLives');
    el.result = document.getElementById('result');
    el.resultTitle = document.getElementById('resultTitle');
    el.resultDetail = document.getElementById('resultDetail');
    el.legend = document.getElementById('legend');
    el.levelHint = document.getElementById('levelHint');

    var pools = loadPools();
    if (!pools) {
      el.levelHint.textContent = '数据加载失败，请确认 data.js 是否完整。';
      return;
    }
    state = { pools: pools, cards: [], found: 0, mistakes: 0, remain: TIME_LIMIT, over: true, level: 'easy' };

    var levelButtons = document.querySelectorAll('.level-card');
    Array.prototype.forEach.call(levelButtons, function (btn) {
      btn.addEventListener('click', function () {
        var level = btn.dataset.level;
        if (level === 'easy' || level === 'medium' || level === 'hard' || level === 'hell') startGame(level);
      });
    });

    el.grid.addEventListener('click', onTileClick);
    document.getElementById('btnRestart').addEventListener('click', function () { startGame(state.level); });
    document.getElementById('btnBack').addEventListener('click', function () { stopTimer(); show('home'); });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

</script>
</body>
</html>
